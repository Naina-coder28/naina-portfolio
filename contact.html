<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Naina Gangwar through the accessible contact form.">

    <meta name="author" content="Naina Gangwar">

    <title>Contact | Naina Gangwar</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Skip link for keyboard users -->
    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>


    <!-- Header -->
    <header>

        <nav aria-label="Main navigation">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="projects.html">
                Projects
            </a>

            <a href="contact.html" aria-current="page">
                Contact
            </a>

        </nav>

    </header>


    <!-- Main Content -->
    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">
                Contact Me
            </h1>

            <p>
                Have a question or want to connect?
                Feel free to send me a message.
            </p>


            <!-- Contact Form -->
            <form action="#" method="post">

                <div>

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Naina Gangwar. All rights reserved.
        </p>

    </footer>

</body>

</html>
